pattern_id: oxidation
display_name: "Oxidation Type"
affects: classification
description: |
  Wilson's primary classification and the only pattern that drives the supplement buckets.
  Combines Ca/K (the thyroid ratio) with Na/Mg (the adrenal ratio) to determine which
  oxidation rate dominates. Four lows is evaluated FIRST and is treated as a separate
  metabolic type, not as extreme slow oxidation (HA INTRO, section VIII).
classifier:
  input:
    - ca_k_ratio
    - na_mg_ratio
    - na_k_ratio
    - ca_ppm
    - mg_ppm
    - na_ppm
    - k_ppm
  evaluation_order:
    - four_lows
    - slow_oxidation
    - fast_oxidation
    - mixed_oxidation
  rules:
    - id: four_lows
      when:
        ca_ppm: {lt: 40}
        mg_ppm: {lt: 6}
        na_ppm: {lt: 25}
        k_ppm: {lt: 10}
      note: |
        ALL FOUR must hold — "if even one of the minerals is outside this range, then it is
        not a four lows pattern." Evaluated before the oxidation rate.
      severity:
        mild: {ca_ppm: [25, 40]}
        moderate: {ca_ppm: [12, 25]}
        severe: {ca_ppm: [null, 12]}
    - id: slow_oxidation
      when:
        ca_k_ratio: {gte: 4.0}
        na_mg_ratio: {lt: 4.17}
      severity:
        mild: {ca_k_ratio: [4.0, 30.0]}
        moderate: {ca_k_ratio: [30.0, 100.0]}
        severe: {ca_k_ratio: [100.0, null]}
      severity_note: |
        Wilson's current tiers (Oxidation Types 1104) read the Ca/K number directly:
        mild < 30, moderate 30-100, extreme > 100. This replaces the staging method in the
        2010/2014/2016 book editions. The existing Dart engine still uses the older
        Stage 1-3 bands (Ca/K > 5, > 6, > 10) — see docs/decisions/0002-severity-tiers.md.
    - id: fast_oxidation
      when:
        ca_k_ratio: {lt: 4.0}
        na_mg_ratio: {gt: 4.17}
      severity:
        mild: {ca_k_ratio: [1.5, 4.0]}
        moderate: {ca_k_ratio: [0.4, 1.5]}
        severe: {ca_k_ratio: [null, 0.4]}
      severity_note: |
        Wilson's current tiers (Oxidation Types 1104): mild Ca/K > 1.5, moderate 0.4-1.5,
        extreme < 0.4.
    - id: mixed_oxidation
      when_any:
        - ca_k_ratio: {gte: 4.0}
          na_mg_ratio: {gte: 4.17}
        - ca_k_ratio: {lt: 4.0}
          na_mg_ratio: {lt: 4.17}
      resolution: more_extreme_ratio
      note: |
        When Ca/K and Na/Mg disagree, classify by whichever ratio sits further from its
        ideal (Ca/K ideal 4.0, Na/Mg ideal 4.17). Wilson: "we handle it by noting which
        ratio is more extreme." Sub-labels: fast-mixed when the fast-indicating ratio is
        further from ideal, slow-mixed when the slow-indicating one is. On a tie, default
        to slow (the far more common adult state, ~80-85% of adults).
      severity:
        mild: {}
        moderate: {}
sub_patterns:
  - id: healthy_vs_tired
    when: {na_k_ratio: {gte: 2.5}}
    label_prefix_true: "healthy"
    label_prefix_false: "tired"
    note: |
      Na/K >= 2.5 gives a "healthy" slow/fast oxidizer; below 2.5 gives a "tired" one.
      Annotation only — the Na/K band is already what splits the buckets.
  - id: temporary_fast_oxidation
    when: {oxidation: fast, age_years_min: 8}
    note: |
      True fast oxidation is mainly seen in children under roughly 3-8 years. Adults
      classified fast are almost always temporary fast oxidizers — slow oxidizers under
      acute stress. Annotation only.
  - id: fast_behaving_slow
    when: {oxidation: fast, na_k_ratio: {lt: 2.5}}
    note: |
      A fast oxidizer with low Na/K behaves clinically more like a slow oxidizer
      (Oxidation Types). Annotation only; bucket 4 already reflects this.
chart_annotations:
  slow_oxidation: |
    Slow oxidizer — Ca/K {ca_k} (above 4) with Na/Mg {na_mg} (below 4.17): reduced adrenal
    and thyroid activity, a more parasympathetic state. Na/K of {na_k} indicates
    {vitality_word} vitality.
  fast_oxidation: |
    Fast oxidizer — Ca/K {ca_k} (below 4) with Na/Mg {na_mg} (above 4.17): the alarm stage
    of stress. Na/K of {na_k} indicates {vitality_word} vitality. In adults this is usually
    temporary fast oxidation rather than true fast oxidation.
  mixed_oxidation: |
    Mixed oxidizer — Ca/K and Na/Mg disagree. Classified as {resolved_oxidation} because
    that ratio is further from ideal. Do not apply a generic fast or slow plan.
  four_lows: |
    Four lows — Ca, Mg, Na and K are all below ideal (Ca<40, Mg<6, Na<25, K<10 mg%).
    Treated as a separate metabolic type, NOT as slow oxidation. Wilson: an extremely
    cautious rebuild; avoid adrenal glandulars, B-complex, vitamin C and E, potassium and
    thyroid hormones on an initial test. On a retest this can instead be benign retracing.
lab_caveats:
  - |
    Wilson's thresholds do not apply to washed hair samples.
  - |
    ARL readings since Feb 2024 come in low: Wilson advises raising Ca and Mg by 25-50%
    and Na and K by 100%+ before applying the four-lows test. Uncorrected, roughly half of
    apparent four-lows charts are not four lows.
references:
  - "drlwilson.com/articles/Oxidation%20Types%201104.htm"
  - "drlwilson.com/Articles/OXID.SLOW..htm"
  - "drlwilson.com/Articles/OXID.FAST.htm"
  - "drlwilson.com/articles/FOUR%20LOWS.htm"
  - "drlwilson.com/Articles/HA%20INTRO.htm"
  - "htma-course-version-two/.../oxidation-types-fast-slow-mixed-four-lows.ts"
  - "htma_labs/lib/core/wilson/pattern_detector.dart"
