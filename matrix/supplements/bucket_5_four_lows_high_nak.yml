bucket_id: four_lows_high_nak
label: "Four Lows + High Na/K"
oxidation: four_lows
na_k_band: above_2.5
description: |
  Four lows pattern (Ca < 40, Mg < 6, Na < 25, K < 10 mg% — ALL four) with Na/K at or
  above 2.5. Wilson treats four lows as a SEPARATE metabolic type, not as extreme slow
  oxidation, and it is evaluated before the oxidation rate. On an initial test it means
  collapse/exhaustion. Program intent: the most cautious rebuild in the matrix — gentle,
  nourishing, no stimulation. Wilson explicitly warns AGAINST adrenal glandulars,
  B-complex, vitamin C, vitamin E, isolated potassium, and thyroid hormones here, which is
  why no adrenal or slow-ox driver appears in this list.
# Per-product Adult dose overrides for this bucket. cal-mag-fusion is
# bumped to 7 caps / 7 caps / 7 caps per Luke 2026-09-12 (true 4-Lows
# adults need the highest Ca/Mg backbone — much higher than the slow-ox
# default of 2·2·2). Kid cells still apply age scaling on top.
adult_dose_overrides:
  cal-mag-fusion:
    am: "7 caps"
    noon: "7 caps"
    pm: "7 caps"
products:
  - id: cal-mag-fusion
    role: calcium_magnesium
    dose_modifier: standard
    notes: |
      Adult 7·7·7 (per Luke 2026-09-12). True 4-Lows is the most
      depleted presentation and needs the highest Ca/Mg backbone.
      See adult_dose_overrides above for the bucket-level override.
      Kid scaling applies on top per the standard age factor.
  - id: zinc-matrix-pro
    role: zinc
    dose_schedule:
      type: linear
      metric: na_k
      anchors:
        - { na_k_max: 2.5, dose: { am: "0",      noon: "0",     pm: "1 cap" } }
        - { na_k_max: 4.0, dose: { am: "1 cap",  noon: "0",     pm: "1 cap" } }
        - { na_k_max: 6.0, dose: { am: "1 cap",  noon: "1 cap", pm: "1 cap" } }
        - { na_k_max: null, dose: { am: "1 cap", noon: "1 cap", pm: "2 caps" } }
    notes: |
      Zinc dose scales linearly with Na/K ratio per locked rule (revised 2026-09-09).
      Anchors: Na/K=2.5 -> 0-0-1 (1 cap PM), 4.0 -> 1-0-1, 6.0 -> 1-1-1, 8.0+ -> 1-1-2 ceiling.
      Heavy-PM distribution pattern: PM gets the heaviest slot in each anchor.
      Replaced by Na/K Up in the low-Na/K four-lows bucket — never both.
  - id: kelp-max
    role: thyroid_iodine
    dose_modifier: standard
    notes: |
      Trace-mineral/iodine nourishment, NOT thyroid stimulation — a glandular or hormone
      would be contraindicated in four lows.
  - id: cell-restore
    role: methylation
    dose_modifier: standard
    notes: "Universal methylation support — present in all 6 buckets."

  - id: red-pilled-sockeye
    role: fish_oil_essential_fatty_acids
    dose_modifier: standard
    notes: |
      Fish oil — 0-0-1 (1000 mg/day). Universal across all buckets.
      Added 2026-09-08.
  - id: valence-se
    role: selenium_antioxidant
    dose_modifier: standard
    notes: |
      Selenium — 2-2-2 default (200 mcg AM, 200 mcg noon, 200 mcg PM).
      Labelled (optional) — practitioner may reduce or skip per patient need.
      Added 2026-09-08.
  - id: kidney-flow
    role: kidney_support
    dose_modifier: standard
    notes: |
      Kidney support — 1-1-1 (1 cap AM, 1 cap NOON, 1 cap PM).
      Labelled (optional) — practitioner may reduce or skip per patient need.
      Added 2026-09-08.
references:
  - "drlwilson.com/articles/FOUR%20LOWS.htm"
  - "drlwilson.com/Articles/DEATH%20PATTERNS.htm"
  - "drlwilson.com/Articles/HA%20INTRO.htm (four lows evaluated before oxidation rate)"
  - "htma-course-version-two/.../oxidation-types-fast-slow-mixed-four-lows.ts"
  - "htma_app_bridge/syncers/protocols.py (canonical Valence product IDs)"

# Per-bucket adult dose overrides (added 2026-09-24). The standard
# cal_mag_dose.py priority function returns 5-5-6 for four_lows by default;
# Luke's locked clinical-practice dose for 4-Lows is 7-7-7 (heavy macromineral
# rebuild), originally from his localStorage session override. The override
# wins over the standard priority because it's the source of truth for the
# bucket's clinical protocol — see writer.py:apply_bucket_overrides().
#
# Rule: when revising a 4-Lows dose override, propagate to bucket_6 too (the
# low-Na/K twin); they share the same locked cal-mag clinical dose.
adult_dose_overrides:
  cal-mag-fusion:
    am: "7 caps"
    noon: "7 caps"
    pm: "7 caps"
