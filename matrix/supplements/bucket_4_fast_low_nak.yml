bucket_id: fast_low_nak
label: "Fast Oxidation + Low Na/K"
oxidation: fast
na_k_band: below_2.5
description: |
  Fast oxidizer with depleted vitality — Wilson's "tired fast oxidizer." Ca/K < 4 and
  Na/Mg > 4.17 but Na/K is below 2.5, so the person behaves clinically more like a slow
  oxidizer than a fast one (Oxidation Types). Wilson's Step Up pattern (fast + double low
  ratio) is detected here as an ANNOTATION only — its copper protocol does not change this
  product list. Program intent: rest, slow down, rebuild electrical potential. Avoid
  adrenal/thyroid glandulars, B-complex, vitamin C and E, and isolated potassium.
products:
  - id: fast-oxidizer
    role: fast_oxidation_support
    dose_modifier: standard
    notes: "Valence fast-oxidizer base formula."
  - id: cal-mag-fusion
    role: calcium_magnesium
    dose_modifier: higher
    notes: "High calming Ca/Mg to slow the oxidation rate."
  - id: na-k-up
    role: sodium_potassium_support
    dose_schedule:
      type: linear
      metric: na_k
      anchors:
        - { na_k_max: 1.0, dose: { am: "2 caps", noon: "2 caps", pm: "2 caps" } }
        - { na_k_max: 1.5, dose: { am: "2 caps", noon: "1 cap",  pm: "2 caps" } }
        - { na_k_max: 1.75, dose: { am: "1 cap", noon: "1 cap", pm: "1 cap" } }
        - { na_k_max: 1.85, dose: { am: "1 cap", noon: "1 cap", pm: "0" } }
        - { na_k_max: 1.99, dose: { am: "1 cap", noon: "1 cap", pm: "0" } }
        - { na_k_max: 2.0, dose: { am: "1 cap",  noon: "0",     pm: "0" } }
        - { na_k_max: null, dose: { am: "0",    noon: "0",      pm: "0" } }
    notes: |
      Na/K Up dose scales linearly with Na/K ratio per locked rule (added 2026-09-08).
      At Na/K<=1.0: 2-2-2 ceiling. At Na/K=2.0: 1-0-0 lighter end. Above Na/K=2.0,
      Na/K Up is not indicated (Zinc Matrix Pro takes over in the high-Na/K buckets).
      Replaces previous flat "standard" dose. The Valence equivalent of LimComin.
      SUBSTITUTES for Zinc Matrix Pro — never both in the same protocol.
  - id: cell-restore
    role: methylation
    dose_modifier: standard
    notes: "Universal methylation support — present in all 6 buckets."
  - id: valence-fastcalm
    role: nervous_system_calming
    dose_modifier: standard
    conditional:
      description: "Add only when Na/K is deeply inverted (roughly Na/K < 2)."
      na_k_max: 2.0
    notes: |
      Practitioner-gated addition, not part of the base list. Included when Na/K is
      approximately below 2, where the calming need is pronounced.

  - id: red-pilled-sockeye
    role: fish_oil_essential_fatty_acids
    dose_modifier: standard
    notes: |
      Fish oil — 0-0-1 (1000 mg/day). Universal across all buckets.
      Added 2026-09-08.
  - id: valence-se
    role: selenium_antioxidant
    dose_modifier: standard
    notes: |
      Selenium — 2-2-2 default (200 mcg AM, 200 mcg noon, 200 mcg PM).
      Labelled (optional) — practitioner may reduce or skip per patient need.
      Added 2026-09-08.
  - id: kidney-flow
    role: kidney_support
    dose_modifier: standard
    notes: |
      Kidney support — 1-1-1 (1 cap AM, 1 cap NOON, 1 cap PM).
      Labelled (optional) — practitioner may reduce or skip per patient need.
      Added 2026-09-08.
  - id: kelp-max
    role: thyroid_iodine
    dose_modifier: standard
    notes: |
      Iodine/trace-mineral nourishment from kelp. Universal across all 6 buckets —
      slow/four-lows buckets get 2-2-2, fast-oxidation buckets get 1-1-0 (per Luke 2026-09-08).
references:
  - "drlwilson.com/Articles/OXID.FAST.htm"
  - "drlwilson.com/articles/Oxidation%20Types%201104.htm (fast + low Na/K behaves like slow)"
  - "drlwilson.com/articles/STEP%20UP-DOWN.HTM (annotation only — no supplement override)"
  - "drlwilson.com/articles/LOW%20SODIUM%20POTASSIUM%20RATIO.htm"
  - "htma_app_bridge/syncers/protocols.py (canonical Valence product IDs)"
