bucket_id: fast_high_nak
label: "Fast Oxidation + High Na/K"
oxidation: fast
na_k_band: above_2.5
description: |
  Fast oxidizer with adequate-to-elevated vitality — Wilson's alarm/fight-or-flight stage
  (Ca/K < 4, Na/Mg > 4.17) with Na/K at or above 2.5. In adults this is almost always
  "temporary fast oxidation" (a slow oxidizer under acute stress) rather than true fast
  oxidation, which is mainly seen in young children. Program intent: slow and buffer the
  system. Do NOT push adrenal or thyroid function, and do not chase the energy with
  stimulants or B-complex.
products:
  - id: fast-oxidizer
    role: fast_oxidation_support
    dose_modifier: standard
    notes: "Valence fast-oxidizer base formula. Buffers rather than stimulates."
  - id: cal-mag-fusion
    role: calcium_magnesium
    dose_modifier: higher
    notes: |
      Higher calming Ca/Mg is the core of the fast-oxidizer program — calcium and
      magnesium slow the oxidation rate.
  - id: zinc-matrix-pro
    role: zinc
    dose_schedule:
      type: linear
      metric: na_k
      anchors:
        - { na_k_max: 2.5, dose: { am: "0",      noon: "0",     pm: "1 cap" } }
        - { na_k_max: 4.0, dose: { am: "0",      noon: "0",     pm: "1 cap" } }
        - { na_k_max: 6.0, dose: { am: "0",      noon: "1 cap", pm: "1 cap" } }
        - { na_k_max: 8.0, dose: { am: "1 cap",  noon: "1 cap", pm: "1 cap" } }
        - { na_k_max: null, dose: { am: "1 cap", noon: "1 cap", pm: "2 caps" } }
    notes: |
      Zinc dose scales linearly with Na/K ratio per locked rule (added 2026-09-08).
      At Na/K=2.5: 0-0-1. At Na/K=8.0+: 1-1-2 ceiling.
      Replaces previous flat "standard" dose. Replaced by Na/K Up in every low-Na/K
      bucket — never both.
  - id: nerv-calm
    role: nervous_system_calming
    dose_modifier: standard
    notes: "Calming support for the alarm-stage nervous system."
  - id: valence-d3-k2
    role: vitamin_d3_k2
    dose_modifier: standard
  - id: cell-restore
    role: methylation
    dose_modifier: standard
    notes: "Universal methylation support — present in all 6 buckets."
references:
  - "drlwilson.com/Articles/OXID.FAST.htm"
  - "drlwilson.com/articles/Oxidation%20Types%201104.htm"
  - "drlwilson.com/articles/HIGH%20SODIUM%20POTASSIUM%20RATIO.htm"
  - "htma-course-version-two/.../fast-oxidation-pattern.ts"
  - "htma_app_bridge/syncers/protocols.py (canonical Valence product IDs)"
