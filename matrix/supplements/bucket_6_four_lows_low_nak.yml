bucket_id: four_lows_low_nak
label: "Four Lows + Low Na/K"
oxidation: four_lows
na_k_band: below_2.5
description: |
  Four lows pattern (Ca < 40, Mg < 6, Na < 25, K < 10 mg% — ALL four) with Na/K below 2.5.
  Same as bucket 5 (4-Lows + High Na/K) but with Na/K below 2.5 — the most depleted
  presentation. Wilson treats four lows as a separate metabolic type, evaluated before
  the oxidation rate. The program intent is the most cautious rebuild in the matrix —
  gentle, nourishing, no stimulation. Same contraindications as bucket 5 — no adrenal
  glandulars, no B-complex, no vitamin C or E, no isolated potassium, no thyroid hormones.
# Per-product Adult dose overrides for this bucket. cal-mag-fusion is
# bumped to 7 caps / 7 caps / 7 caps per Luke 2026-09-12 (true 4-Lows
# adults need the highest Ca/Mg backbone). Kid cells still apply
# age scaling on top.
adult_dose_overrides:
  cal-mag-fusion:
    am: "7 caps"
    noon: "7 caps"
    pm: "7 caps"
products:
  - id: cal-mag-fusion
    role: calcium_magnesium
    dose_modifier: standard
    notes: |
      Adult 7·7·7 (per Luke 2026-09-12). True 4-Lows is the most
      depleted presentation and needs the highest Ca/Mg backbone.
      See adult_dose_overrides above for the bucket-level override.
      Kid scaling applies on top per the standard age factor.
  - id: na-k-up
    role: na_k_support
    dose_schedule:
      type: linear
      metric: na_k
      anchors:
        - { na_k_max: 1.0,  dose: { am: "2 caps", noon: "2 caps", pm: "2 caps" } }
        - { na_k_max: 1.5,  dose: { am: "2 caps", noon: "1 cap",  pm: "2 caps" } }
        - { na_k_max: 1.75, dose: { am: "1 cap",  noon: "1 cap",  pm: "1 cap" } }
        - { na_k_max: 1.85, dose: { am: "1 cap",  noon: "1 cap",  pm: "0" } }
        - { na_k_max: 1.99, dose: { am: "1 cap",  noon: "1 cap",  pm: "0" } }
        - { na_k_max: 2.0,  dose: { am: "1 cap",  noon: "0",      pm: "0" } }
        - { na_k_max: null, dose: { am: "0",     noon: "0",      pm: "0" } }
    notes: |
      Na/K Up dose ladder for the low-Na/K four-lows bucket. Anchors at
      Na/K=1.0, 1.5, 1.75, 1.85, 1.99, 2.0, and ceiling. Same ladder as
      slow-ox and fast-ox low-Na/K buckets. Ceiling dose is 0·0·0
      because four-lows patients can't tolerate Na/K Up stimulation.
  - id: kelp-max
    role: thyroid_iodine
    dose_modifier: standard
    notes: |
      Iodine/trace-mineral nourishment, NOT thyroid stimulation — a glandular or hormone
      would be contraindicated in four lows.
  - id: cell-restore
    role: methylation
    dose_modifier: standard
    notes: "Universal methylation support — present in all buckets."
  - id: red-pilled-sockeye
    role: fish_oil_essential_fatty_acids
    dose_modifier: standard
    notes: |
      Fish oil — 0-0-1 (1000 mg/day). Universal across all buckets.
      Added 2026-09-08.
  - id: valence-se
    role: selenium_antioxidant
    dose_modifier: standard
    notes: |
      Selenium — 2-2-2 default (200 mcg AM, 200 mcg noon, 200 mcg PM).
      Labelled (optional) — practitioner may reduce or skip per patient need.
      Added 2026-09-08.
  - id: kidney-flow
    role: kidney_support
    dose_modifier: standard
    notes: |
      Kidney support — 1-1-1 (1 cap AM, 1 cap NOON, 1 cap PM).
      Labelled (optional) — practitioner may reduce or skip per patient need.
      Added 2026-09-08.
references:
  - "drlwilson.com/articles/FOUR%20LOWS.htm"
  - "drlwilson.com/Articles/HA%20INTRO.htm (four lows evaluated before oxidation rate)"
  - "htma-course-version-two/.../oxidation-types-fast-slow-mixed-four-lows.ts"
  - "htma_app_bridge/syncers/protocols.py (canonical Valence product IDs)"

# Per-bucket adult dose overrides (added 2026-09-24). The standard
# cal_mag_dose.py priority function returns 5-5-6 for four_lows by default;
# Luke's locked clinical-practice dose for 4-Lows is 7-7-7 (heavy macromineral
# rebuild), originally from his localStorage session override. The override
# wins over the standard priority because it's the source of truth for the
# bucket's clinical protocol — see writer.py:apply_bucket_overrides().
#
# Rule: twin to bucket_5_four_lows_high_nak — same cal-mag override on
# purpose. Both 4-Lows buckets carry 7·7·7 per Luke's clinical rule.
adult_dose_overrides:
  cal-mag-fusion:
    am: "7 caps"
    noon: "7 caps"
    pm: "7 caps"
